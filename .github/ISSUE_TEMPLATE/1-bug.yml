name: 🩸 Bug report · 症狀回報
description: Something is broken. Write it up like an admission note — it gets fixed faster.
title: "[Bug] "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. A good bug report reads like a good admission note:
        **chief complaint → history → how to reproduce → vitals (versions)**.
        謝謝你回報！照病歷格式寫，我們就能更快處理。

        ⚠️ **Never paste patient data, credentials or API keys.** 請勿貼上任何病人資料或金鑰。
  - type: input
    id: cc
    attributes:
      label: Chief complaint · 主訴
      description: One line. What is wrong?
      placeholder: "`generate_listening.py` crashes when one TTS voice is unavailable"
    validations:
      required: true
  - type: textarea
    id: hpi
    attributes:
      label: History of present illness · 現病史
      description: What did you do, what did you expect, and what happened instead?
      placeholder: |
        Expected: …
        Actual: …
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce · 重現步驟
      description: The smallest sequence of commands or clicks that triggers it.
      render: shell
      placeholder: |
        1. git clone …
        2. uv run …
        3. see error
    validations:
      required: true
  - type: textarea
    id: labs
    attributes:
      label: Labs · 錯誤訊息與 log
      description: Paste the full error or relevant log. It is shown as code automatically.
      render: text
  - type: input
    id: vitals
    attributes:
      label: Vital signs · 環境版本
      description: OS, runtime and version of this project (commit, tag or release).
      placeholder: "macOS 16.1 · Python 3.12.4 · v1.4.0 (or commit abc1234)"
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Triage · 嚴重度
      options:
        - "🟢 Minor — annoying, has a workaround"
        - "🟡 Moderate — a feature does not work"
        - "🔴 Severe — data loss, wrong clinical output, or nothing runs"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting · 送出前
      options:
        - label: I searched existing issues and this is not a duplicate. 我找過了，沒有重複。
          required: true
        - label: I removed all patient data, secrets and tokens. 我已移除病人資料與金鑰。
          required: true
